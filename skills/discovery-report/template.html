<title><!-- SLOT:title --> — Automation Discovery</title>
<!--
  Orchard Discovery Report template. Fill only the <!-- SLOT:* --> regions from the
  MCP discovery data. Do NOT edit the <style> block — it is Orchard's design system
  (voidbrand ground; ember=impact, gold=caveat/buried-gold, ice=diagnostic; theme-aware).
  Pick ONE accent for --accent based on the estate's story:
    ember (#ff7a45) = a real goldmine · gold (#e6b23c) = value buried under mess ·
    ice (#86b7c9) = thin, little to automate.
-->
<style>
  :root{
    --ground:#0b0f0e;--panel:#121817;--panel-2:#171f1d;--ink:#e9efec;--muted:#8b9691;--faint:#5d6a65;
    --hair:rgba(233,239,236,0.09);--hair-2:rgba(233,239,236,0.05);
    --ember:#ff7a45;--gold:#e6b23c;--ice:#86b7c9;
    --yes:#57b981;--yes-bg:rgba(87,185,129,0.13);--partial:#9aa6a1;--partial-bg:rgba(154,166,161,0.12);
    --warn:#e6b23c;--warn-bg:rgba(230,178,60,0.13);--bar-track:rgba(233,239,236,0.06);
    /* SLOT:accent — set to var(--ember), var(--gold), or var(--ice) */
    --accent:var(--ember); --accent-soft:rgba(255,122,69,0.14);
    --sans:"SF Pro Display","Segoe UI",system-ui,-apple-system,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",monospace;
  }
  @media (prefers-color-scheme:light){:root{--ground:#f5f7f4;--panel:#fff;--panel-2:#f0f3ef;--ink:#14201b;--muted:#5c6a63;--faint:#8f9c94;--hair:rgba(20,32,27,0.12);--hair-2:rgba(20,32,27,0.06);--ember:#d9531f;--gold:#a9791a;--ice:#2f6f85;--yes:#2f8a58;--yes-bg:rgba(47,138,88,0.12);--partial:#6b7873;--partial-bg:rgba(107,120,115,0.12);--warn:#a9791a;--warn-bg:rgba(169,121,26,0.13);--bar-track:rgba(20,32,27,0.07);}}
  :root[data-theme="dark"]{--ground:#0b0f0e;--panel:#121817;--panel-2:#171f1d;--ink:#e9efec;--muted:#8b9691;--faint:#5d6a65;--hair:rgba(233,239,236,0.09);--hair-2:rgba(233,239,236,0.05);--ember:#ff7a45;--gold:#e6b23c;--ice:#86b7c9;--yes:#57b981;--yes-bg:rgba(87,185,129,0.13);--partial:#9aa6a1;--partial-bg:rgba(154,166,161,0.12);--warn:#e6b23c;--warn-bg:rgba(230,178,60,0.13);--bar-track:rgba(233,239,236,0.06);}
  :root[data-theme="light"]{--ground:#f5f7f4;--panel:#fff;--panel-2:#f0f3ef;--ink:#14201b;--muted:#5c6a63;--faint:#8f9c94;--hair:rgba(20,32,27,0.12);--hair-2:rgba(20,32,27,0.06);--ember:#d9531f;--gold:#a9791a;--ice:#2f6f85;--yes:#2f8a58;--yes-bg:rgba(47,138,88,0.12);--partial:#6b7873;--partial-bg:rgba(107,120,115,0.12);--warn:#a9791a;--warn-bg:rgba(169,121,26,0.13);--bar-track:rgba(20,32,27,0.07);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  .wrap{max-width:940px;margin:0 auto;padding:clamp(28px,5vw,64px) clamp(18px,4vw,40px) 80px;}
  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:0.22em;text-transform:uppercase;color:var(--accent);margin:0 0 18px;}
  .eyebrow .dot{color:var(--faint);margin:0 8px;}
  h1{font-size:clamp(34px,6vw,58px);line-height:1.02;letter-spacing:-0.025em;font-weight:800;margin:0 0 14px;text-wrap:balance;}
  .lede{color:var(--muted);font-size:16px;max-width:64ch;margin:0;}.lede b{color:var(--ink);font-weight:600;}
  .rule{height:1px;background:var(--hair);border:0;margin:40px 0;}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:12px;overflow:hidden;}
  .stat{background:var(--panel);padding:22px 20px;}.stat .n{font-size:clamp(26px,4.2vw,40px);font-weight:800;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;line-height:1;}
  .stat .n.accent{color:var(--accent);}.stat .u{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.35;}
  @media (max-width:720px){.stats{grid-template-columns:repeat(2,1fr);}}
  h2{font-size:13px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.16em;color:var(--muted);font-weight:500;margin:0 0 4px;}
  .section-note{color:var(--faint);font-size:13.5px;margin:0 0 20px;max-width:66ch;}
  .tablecard{border:1px solid var(--hair);border-radius:12px;overflow:hidden;background:var(--panel);}.scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;min-width:600px;}
  thead th{font-family:var(--mono);font-size:10.5px;letter-spacing:0.13em;text-transform:uppercase;color:var(--faint);font-weight:500;text-align:left;padding:13px 16px;border-bottom:1px solid var(--hair);white-space:nowrap;}
  thead th.num,tbody td.num{text-align:right;font-variant-numeric:tabular-nums;}
  tbody td{padding:12px 16px;border-bottom:1px solid var(--hair-2);vertical-align:middle;font-size:14px;}tbody tr:last-child td{border-bottom:0;}
  tbody tr.lead td{background:var(--accent-soft);}
  .cat{font-weight:600;}.cat .sub{display:block;font-size:11.5px;color:var(--faint);font-weight:400;margin-top:2px;font-family:var(--mono);}
  .pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;padding:3px 9px;border-radius:100px;font-weight:500;white-space:nowrap;}
  .pill.yes{color:var(--yes);background:var(--yes-bg);}.pill.yes::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--yes);}
  .pill.partial{color:var(--partial);background:var(--partial-bg);}.pill.partial::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--partial);}
  .verbs{display:flex;flex-wrap:wrap;gap:5px;}.verb{font-family:var(--mono);font-size:10.5px;color:var(--ice);border:1px solid var(--hair);border-radius:5px;padding:2px 7px;white-space:nowrap;}
  .callout{display:flex;gap:16px;align-items:baseline;margin-top:18px;padding:16px 20px;border:1px solid var(--hair);border-left:2px solid var(--accent);border-radius:8px;background:var(--panel-2);}
  .callout .big{font-size:26px;font-weight:800;color:var(--accent);letter-spacing:-0.02em;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .callout .txt{font-size:13.5px;color:var(--muted);}.callout .txt b{color:var(--ink);font-weight:600;}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;}@media (max-width:720px){.cards{grid-template-columns:1fr;}}
  .card{border:1px solid var(--hair);border-radius:12px;background:var(--panel);padding:20px;}
  .card .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px;}
  .card .rate{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}.card .rate b{color:var(--accent);font-size:15px;font-weight:700;}
  .flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:12px;}
  .tool{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:6px;background:var(--panel-2);border:1px solid var(--hair);}
  .arrow{color:var(--faint);font-size:12px;}.card .desc{font-size:12.5px;color:var(--muted);margin-bottom:11px;}
  .card .meta{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:0.03em;}
  footer{margin-top:44px;padding-top:26px;border-top:1px solid var(--hair);}
  footer h3{font-family:var(--mono);font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 14px;}
  .fine{color:var(--faint);font-size:12px;line-height:1.6;}
</style>

<div class="wrap">
  <p class="eyebrow">Orchard <span class="dot">/</span> Automation Discovery <span class="dot">/</span> Field Report</p>
  <h1><!-- SLOT:headline — a specific, honest thesis for THIS estate --></h1>
  <p class="lede"><!-- SLOT:lede — 2 sentences; measured framing; if the estate is thin, say so --></p>

  <div class="stats" role="list">
    <!-- SLOT:stats — four <div class="stat"><div class="n accent">VALUE</div><div class="u">meaning</div></div>.
         Use real aggregates from the candidates: total est hours/week, count rated "yes", total candidates, etc. -->
  </div>

  <hr class="rule" />

  <!-- SLOT:psa_section — include ONLY if there are source=="psa" candidates:
    <h2>Recurring ticket categories</h2>
    <p class="section-note">…priced from logged ConnectWise labor…</p>
    <div class="tablecard"><div class="scroll"><table>
      <thead><tr><th>Category</th><th class="num">Per week</th><th>Automatable</th><th>Suggested automation</th></tr></thead>
      <tbody>
        one <tr> per PSA candidate (add class="lead" to the top row): title in .cat, est hours/week, a .pill (yes|partial), .verbs chips from suggested_verbs.
      </tbody>
    </table></div></div>
    Optional <div class="callout"> for the single biggest number or a hygiene finding.
  -->

  <hr class="rule" />

  <!-- SLOT:activity_section — include ONLY if there are source=="activity" candidates:
    <h2>Recurring desktop rituals</h2>
    <p class="section-note">…repeated app sequences from the activity stream…</p>
    <div class="cards">
      one <div class="card"> per activity candidate: a .pill + .rate (est min/wk), a .flow of .tool chips
      (from the ritual apps / pattern, joined by <span class="arrow">→</span>), a .desc (the pitch),
      a .meta (occurrences · days · users), and .verbs.
    </div>
  -->

  <footer>
    <h3>How this was found</h3>
    <p class="fine"><!-- SLOT:method — measured vs modelled; deterministic detection; noise filtered;
      source estate + counts + date. Keep the honesty: dollar figures are rate-labelled, hours are measured. --></p>
  </footer>
</div>
